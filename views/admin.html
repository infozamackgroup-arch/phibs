<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Phibs Admin</title><link rel="icon" href="/logo.png">
<style>
:root{--ink:#17231f;--green:#183b32;--gold:#c5a36a;--cream:#f7f5ef;--muted:#69736d;--line:#e7e4dc;--red:#b3261e}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
header{background:#fff;border-bottom:3px solid var(--gold);display:flex;align-items:center;gap:14px;padding:10px 20px;flex-wrap:wrap}header img{height:46px}header b{font-size:17px;color:var(--green)}header .sp{flex:1}
nav{display:flex;gap:6px;padding:12px 20px 0;flex-wrap:wrap}nav button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:8px 16px;font:inherit;cursor:pointer;color:var(--ink)}nav button.on{background:var(--green);color:#fff;border-color:var(--green)}
main{max-width:1100px;margin:0 auto;padding:18px 20px 70px}.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:16px}
h2{margin:0 0 4px;font-size:20px;color:var(--green)}.hint{color:var(--muted);margin:0 0 14px;font-size:14px}
label{display:block;font-weight:600;font-size:13px;margin:12px 0 4px}input,select,textarea{width:100%;font:inherit;padding:9px 11px;border:1.5px solid #cfd6d1;border-radius:8px;background:#fff;color:var(--ink)}textarea{min-height:76px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px rgba(24,59,50,.14)}
.btn{background:var(--green);color:#fff;border:0;border-radius:8px;padding:10px 18px;font:600 14px system-ui;cursor:pointer}.btn.ghost{background:#fff;color:var(--green);border:1.5px solid var(--green)}.btn.red{background:#fff;color:var(--red);border:1.5px solid var(--red);padding:6px 12px}.btn.sm{padding:6px 12px;font-size:13px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}.two{display:grid;gap:14px;grid-template-columns:1fr 1fr}
.photo{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}.photo img{width:100%;height:150px;object-fit:cover;display:block;background:#eee}.photo div{padding:10px}.photo b{display:block;font-size:13px;margin-bottom:6px}
table{width:100%;border-collapse:collapse;font-size:14px}th{text-align:left;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding:8px;border-bottom:2px solid var(--line)}td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}.wrap{overflow-x:auto}
td input,td select{padding:6px 8px;font-size:13px}.ref{font-weight:700;color:var(--green);white-space:nowrap}.muted{color:var(--muted);font-size:13px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--green);color:#fff;padding:11px 20px;border-radius:99px;opacity:0;transition:.25s;pointer-events:none;z-index:9}.toast.show{opacity:1}.toast.bad{background:var(--red)}
.login{max-width:380px;margin:9vh auto}.err{color:var(--red);min-height:20px;margin-top:8px}@media(max-width:700px){.two{grid-template-columns:1fr}}
</style></head><body>
<div id="app"></div><div class="toast" id="toast"></div>
<script>
var $=function(s,r){return(r||document).querySelector(s)},$$=function(s,r){return[].slice.call((r||document).querySelectorAll(s))};
var esc=function(t){return String(t==null?'':t).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})},naira=function(n){return'₦'+Number(n||0).toLocaleString('en-NG')};
var S=null,tab='bookings',BK=[];
function toast(m,bad){var t=$('#toast');t.textContent=m;t.className='toast show'+(bad?' bad':'');clearTimeout(toast.t);toast.t=setTimeout(function(){t.className='toast'},2600)}
function api(p,body,raw){var o={method:body||raw?'POST':'GET',headers:{}};if(raw){o.body=raw.blob;o.headers['Content-Type']=raw.type}else if(body){o.headers['Content-Type']='application/json';o.body=JSON.stringify(body)}
 return fetch('/api/admin'+p,o).then(function(r){return r.json().catch(function(){return{}}).then(function(j){if(r.status===401&&p!=='/login'){S=null;login()}if(!r.ok)throw new Error(j.error||'Something went wrong.');return j})})}
function login(){$('#app').innerHTML='<div class="login card"><img src="/logo.png" alt="" style="height:60px;margin-bottom:8px"><h2>Admin login</h2><p class="hint">Phibs Luxury Homes</p><label>Username</label><input id="u" autocomplete="username"><label>Password</label><input id="p" type="password" autocomplete="current-password"><p class="err" id="e"></p><button class="btn" id="go">Log in</button></div>';
 var go=function(){api('/login',{username:$('#u').value,password:$('#p').value}).then(load).catch(function(e){$('#e').textContent=e.message})};$('#go').onclick=go;$('#p').onkeydown=function(e){if(e.key==='Enter')go()}}
function load(){return api('/state').then(function(s){S=s;shell()}).catch(function(){})}
function shell(){var tabs=[['bookings','Bookings'],['text','Website text'],['photos','Photos'],['rooms','Apartments & prices'],['settings','Settings']];
 $('#app').innerHTML='<header><img src="/logo.png" alt=""><b>Website admin</b><span class="sp"></span><a href="/" target="_blank" class="muted">View website</a><button class="btn ghost sm" id="out">Log out</button></header><nav>'+tabs.map(function(t){return'<button data-t="'+t[0]+'" class="'+(t[0]===tab?'on':'')+'">'+t[1]+'</button>'}).join('')+'</nav><main id="main"></main>';
 $$('nav button').forEach(function(b){b.onclick=function(){tab=b.dataset.t;shell()}});$('#out').onclick=function(){api('/logout',{}).then(login)};({bookings:bookings,text:text,photos:photos,rooms:rooms,settings:settings})[tab]()}
/* ---- bookings ---- */
function bookings(){$('#main').innerHTML='<div class="card"><h2>Bookings</h2><p class="hint">Every booking made on the website appears here with its receipt number. Change the status and record payments as they come in.</p><div class="two"><input id="q" placeholder="Search name, phone or receipt number"><div style="text-align:right"><a class="btn ghost sm" href="/api/admin/bookings.csv">Download spreadsheet (CSV)</a></div></div><div class="wrap" id="bt" style="margin-top:12px"></div></div>';
 api('/bookings').then(function(d){BK=d.bookings;paint()});$('#q').oninput=paint}
function paint(){var f=($('#q').value||'').toLowerCase(),rows=BK.filter(function(b){return(b.ref+b.name+b.phone+b.room).toLowerCase().indexOf(f)>-1});
 $('#bt').innerHTML=rows.length?'<table><thead><tr><th>Receipt</th><th>Guest</th><th>Stay</th><th>Total</th><th>Status</th><th>Paid (₦)</th><th>Note</th><th></th></tr></thead><tbody>'+rows.map(function(b){var tot=b.subtotal+b.caution,wa=b.phone.replace(/\D/g,'').replace(/^0/,'234');
 return'<tr data-id="'+b.id+'"><td class="ref">'+b.ref+'<div class="muted">'+esc(b.created_at.slice(0,10))+'</div></td><td><b>'+esc(b.name)+'</b><div class="muted">'+esc(b.phone)+'<br>'+esc(b.email)+'</div></td><td>'+esc(b.room)+'<div class="muted">'+esc(b.checkin)+' to '+esc(b.checkout)+' ('+b.nights+'n, '+esc(b.guests)+' guests)</div></td><td>'+naira(tot)+'<div class="muted">deposit '+naira(b.deposit)+'</div></td>'+
 '<td><select class="st">'+['pending','confirmed','paid','completed','cancelled'].map(function(s){return'<option value="'+s+'"'+(b.status===s?' selected':'')+'>'+s[0].toUpperCase()+s.slice(1)+'</option>'}).join('')+'</select></td><td><input class="pd" inputmode="numeric" value="'+(b.amount_paid||'')+'" style="width:100px"></td><td><input class="nt" value="'+esc(b.notes||'')+'" style="min-width:120px"></td><td style="white-space:nowrap"><a href="'+b.url+'" target="_blank">Receipt</a><br><a href="https://wa.me/'+wa+'" target="_blank">WhatsApp</a></td></tr>'}).join('')+'</tbody></table>':'<p class="muted">No bookings yet.</p>';
 $$('#bt tr[data-id]').forEach(function(tr){var save=function(){api('/bookings/'+tr.dataset.id,{status:$('.st',tr).value,amount_paid:$('.pd',tr).value,notes:$('.nt',tr).value}).then(function(){toast('Saved');var b=BK.filter(function(x){return x.id==tr.dataset.id})[0];b.status=$('.st',tr).value;b.amount_paid=$('.pd',tr).value;b.notes=$('.nt',tr).value}).catch(function(e){toast(e.message,1)})};$$('select,input',tr).forEach(function(i){i.onchange=save})})}
/* ---- text ---- */
function text(){$('#main').innerHTML='<div class="card"><h2>Website text</h2><p class="hint">Change the wording on the home page. Press Save at the bottom and refresh the website to see it.</p>'+S.fields.map(function(f){return'<label>'+esc(f.label)+'</label><textarea data-k="'+f.key+'">'+esc(f.value)+'</textarea>'}).join('')+'<p style="margin-top:16px"><button class="btn" id="sv">Save changes</button></p></div>';
 $('#sv').onclick=function(){var b={};$$('textarea[data-k]').forEach(function(t){b[t.dataset.k]=t.value});api('/text',b).then(function(){toast('Saved. Refresh the website to see it.');return load()}).catch(function(e){toast(e.message,1)})}}
/* ---- photos ---- */
function shrink(file){return createImageBitmap(file).then(function(im){var s=Math.min(1,1600/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);return new Promise(function(r){c.toBlob(r,'image/jpeg',.85)})})}
function upload(slot,files){var list=[].slice.call(files);toast('Uploading '+list.length+' photo'+(list.length>1?'s':'')+'...');return list.reduce(function(p,f){return p.then(function(){return shrink(f).then(function(b){return api('/upload?slot='+encodeURIComponent(slot),null,{blob:b,type:'image/jpeg'})})})},Promise.resolve()).then(function(){toast('Photo saved');return load().then(function(){photos()})}).catch(function(e){toast(e.message,1)})}
function slot(title,slotName,src){return'<div class="photo"><img src="'+esc(src||'')+'" alt=""><div><b>'+esc(title)+'</b><input type="file" accept="image/*" data-slot="'+esc(slotName)+'"> '+(src&&src.indexOf('/media/')===0?'<p style="margin:8px 0 0"><button class="btn red" data-reset="'+esc(slotName)+'">Back to original</button></p>':'')+'</div></div>'}
function photos(){var g=S.gallery;$('#main').innerHTML='<div class="card"><h2>Apartment photos</h2><p class="hint">The main photo shown on each apartment card. Choose a photo from your phone or computer and it is saved straight away.</p><div class="grid">'+S.rooms.map(function(r){return slot(r.name,'room:'+r.name,r.img)}).join('')+'</div></div>'+
 '<div class="card"><h2>Other pictures</h2><div class="grid">'+slot('About section picture','about',S.slots.about||'')+slot('Founder photo','founder',S.slots.founder||'')+'</div></div>'+
 '<div class="card"><h2>Gallery</h2><p class="hint">'+(g.length?'These photos replace the default gallery on the website.':'The website is showing the original gallery. Add photos here to replace it.')+'</p><div class="grid">'+g.map(function(id){return'<div class="photo"><img src="/media/'+id+'" alt=""><div><button class="btn red" data-rm="'+id+'">Remove</button></div></div>'}).join('')+'</div><p style="margin-top:14px"><label>Add gallery photos (you can choose several)</label><input type="file" accept="image/*" multiple data-slot="gallery"></p></div>';
 $$('input[data-slot]').forEach(function(i){i.onchange=function(){if(i.files.length)upload(i.dataset.slot,i.files)}});
 $$('[data-reset]').forEach(function(b){b.onclick=function(){api('/photo/remove',{slot:b.dataset.reset}).then(load).then(photos)}});$$('[data-rm]').forEach(function(b){b.onclick=function(){if(confirm('Remove this photo?'))api('/photo/remove',{slot:'gallery',id:b.dataset.rm}).then(load).then(photos)}})}
/* ---- apartments ---- */
function rooms(){$('#main').innerHTML='<div class="card"><h2>Apartments & prices</h2><p class="hint">Prices are per night in Naira. Changes apply to the website and to new bookings straight away.</p>'+S.rooms.map(function(r,i){return'<div class="card" data-i="'+i+'" style="background:#fbfaf6"><b>'+esc(r.name)+'</b><div class="two"><div><label>Price per night (₦)</label><input class="rate" inputmode="numeric" value="'+r.rate+'"></div><div><label>Maximum guests</label><input class="cap" inputmode="numeric" value="'+r.cap+'"></div></div><label>Short tag on the photo</label><input class="tag" value="'+esc(r.tag)+'"><label>Description</label><textarea class="desc">'+esc(r.desc)+'</textarea></div>'}).join('')+'<button class="btn" id="sv">Save apartments</button></div>';
 $('#sv').onclick=function(){api('/rooms',{rooms:$$('[data-i]').map(function(c){var r=S.rooms[c.dataset.i];return{name:r.name,rate:$('.rate',c).value,cap:$('.cap',c).value,tag:$('.tag',c).value,desc:$('.desc',c).value}})}).then(function(){toast('Saved');return load()}).catch(function(e){toast(e.message,1)})}}
/* ---- settings ---- */
function settings(){var s=S.settings,f=function(k,l,h){return'<label>'+l+'</label><input data-k="'+k+'" value="'+esc(s[k])+'">'+(h?'<div class="muted">'+h+'</div>':'')};
 $('#main').innerHTML='<div class="card"><h2>Contact details</h2><p class="hint">Used everywhere on the website and on receipts.</p><div class="two"><div>'+f('email','Email')+f('phone1','Main phone (as shown)')+f('phone1_tel','Main phone (no spaces, with +234)')+'</div><div>'+f('whatsapp','WhatsApp number (digits only, e.g. 2349162330835)')+f('phone2','Second phone (as shown)')+f('phone2_tel','Second phone (no spaces, with +234)')+'</div></div></div>'+
 '<div class="card"><h2>Booking rules</h2><div class="two"><div>'+f('caution','Caution fee (₦)')+'</div><div>'+f('deposit','Deposit to confirm (% of stay)')+'</div></div>'+f('receipt_next','Next receipt number should be at least','Receipts are numbered PLH-001, PLH-002 and so on. Leave as 1 unless you need to continue from an older number.')+'<p style="margin-top:16px"><button class="btn" id="sv">Save settings</button></p></div>'+
 '<div class="card"><h2>Change password</h2><div class="two"><div><label>Current password</label><input id="pc" type="password" autocomplete="current-password"></div><div><label>New password (at least 10 characters)</label><input id="pn" type="password" autocomplete="new-password"></div></div><p style="margin-top:16px"><button class="btn ghost" id="pw">Change password</button></p></div>';
 $('#sv').onclick=function(){var b={};$$('input[data-k]').forEach(function(i){b[i.dataset.k]=i.value});api('/settings',b).then(function(){toast('Saved');return load()}).catch(function(e){toast(e.message,1)})};
 $('#pw').onclick=function(){api('/password',{current:$('#pc').value,next:$('#pn').value}).then(function(){toast('Password changed');$('#pc').value=$('#pn').value=''}).catch(function(e){toast(e.message,1)})}}
load().then(function(){if(!S)login()});
</script></body></html>
