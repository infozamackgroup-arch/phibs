<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Phibs Admin</title>
<style>
:root{--green:#183b32;--green2:#245446;--gold:#c9a45c;--paper:#f5f3ee;--line:#e2ded3;--ink:#1c2420;--muted:#6b756f;--red:#b3392c;--redbg:#fbe9e6;--okbg:#e4f2ea;--ok:#1d7a4d;--warnbg:#fff3d6;--warn:#8a6200}
*{box-sizing:border-box}body{margin:0;font-family:"DM Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--paper);color:var(--ink);font-size:15px;line-height:1.5}
h1,h2,h3{font-family:"Playfair Display",Georgia,serif;margin:0;line-height:1.15}h1{font-size:30px}h2{font-size:22px}h3{font-size:18px}
a{color:var(--green2)}button,input,select,textarea{font:inherit;color:inherit}
header{background:var(--green);color:#fff;position:sticky;top:0;z-index:20}
.bar{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px}
.bar img{height:42px;background:#fff;padding:4px 10px;border-radius:5px}.bar b{margin-right:auto;font-family:"Playfair Display",Georgia,serif;font-size:18px}
.bar button{background:transparent;border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:999px;padding:7px 16px;cursor:pointer}
nav{background:var(--green2);overflow-x:auto}nav div{max-width:1180px;margin:0 auto;padding:0 10px;display:flex;gap:2px;width:max-content;min-width:100%}
nav a{color:#d8e4dd;text-decoration:none;padding:12px 15px;font-weight:600;font-size:14px;white-space:nowrap;border-bottom:3px solid transparent}nav a.on{color:#fff;border-color:var(--gold)}
main{max-width:1180px;margin:0 auto;padding:22px 16px 80px}
.head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:20px;margin-bottom:16px}
.grid{display:grid;gap:14px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.stat{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px 18px}.stat small{color:var(--muted);display:block}.stat b{font-size:28px;font-family:"Playfair Display",Georgia,serif}
label{display:block;font-weight:600;font-size:13px;margin-bottom:5px}.field{margin-bottom:14px}
input,select,textarea{width:100%;border:1px solid #cfcabd;border-radius:7px;padding:10px 12px;background:#fff}input:focus,select:focus,textarea:focus{outline:2px solid var(--gold);border-color:var(--gold)}textarea{min-height:90px;resize:vertical}
.btn{display:inline-block;background:var(--green);color:#fff;border:0;border-radius:7px;padding:10px 18px;font-weight:600;cursor:pointer;text-decoration:none}.btn:hover{background:var(--green2)}
.btn.gold{background:var(--gold);color:#1c1c1c}.btn.ghost{background:#fff;color:var(--green);border:1px solid var(--line)}.btn.red{background:var(--red)}.btn.sm{padding:6px 12px;font-size:13px}
.scroll{overflow-x:auto}table{width:100%;border-collapse:collapse}th{text-align:left;font-size:12px;color:var(--muted);padding:8px 10px;white-space:nowrap;border-bottom:1px solid var(--line)}td{padding:10px;border-bottom:1px solid #eee9de;vertical-align:top}
tr.click{cursor:pointer}tr.click:hover td{background:#faf8f3}.num{text-align:right;white-space:nowrap}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:700;white-space:nowrap}.p-awaiting_payment{background:var(--warnbg);color:var(--warn)}.p-confirmed{background:var(--okbg);color:var(--ok)}.p-checked_in{background:#dfeaf7;color:#1f4e8c}.p-completed{background:#ebe9e3;color:#555}.p-cancelled{background:var(--redbg);color:var(--red)}
.alert{padding:12px 16px;border-radius:8px;margin-bottom:14px}.alert.bad{background:var(--redbg);color:#8d2a1f}.alert.warn{background:var(--warnbg);color:#6b4d00}.alert.ok{background:var(--okbg);color:#0f5a36}
.muted{color:var(--muted);font-size:13px}.err{color:var(--red);min-height:20px}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}.ph{position:relative;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#eee}.ph img{width:100%;height:90px;object-fit:cover;display:block}
.ph .x{position:absolute;top:4px;right:4px;background:rgba(0,0,0,.65);color:#fff;border:0;border-radius:50%;width:24px;height:24px;cursor:pointer}.ph .cv{position:absolute;left:4px;bottom:4px;background:var(--gold);color:#000;font-size:11px;font-weight:700;border-radius:4px;padding:1px 6px}.ph button.mk{position:absolute;left:4px;bottom:4px;background:rgba(255,255,255,.9);border:0;border-radius:4px;font-size:11px;padding:1px 6px;cursor:pointer}
.apt{display:grid;grid-template-columns:120px 1fr auto;gap:16px;align-items:center}.apt img{width:120px;height:84px;object-fit:cover;border-radius:6px;background:#eee}
.modal-bg{position:fixed;inset:0;background:rgba(20,30,25,.6);z-index:50;overflow-y:auto;padding:4vh 12px}.modal{background:#fff;border-radius:12px;max-width:760px;margin:0 auto;padding:24px}.modal .top{display:flex;justify-content:space-between;gap:10px;margin-bottom:14px}.modal .x{background:#eee;border:0;border-radius:50%;width:34px;height:34px;font-size:20px;cursor:pointer}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(80px);background:var(--green);color:#fff;padding:12px 22px;border-radius:99px;opacity:0;transition:.25s;z-index:90;max-width:92%}.toast.show{transform:translateX(-50%);opacity:1}.toast.bad{background:var(--red)}
.login{max-width:380px;margin:12vh auto;padding:0 16px}.login img{height:70px;display:block;margin:0 auto 18px}
#rcpt{position:fixed;inset:0;background:#d9d6cc;z-index:80;overflow:auto;padding:16px}.rc-bar{max-width:820px;margin:0 auto 12px;display:flex;gap:10px}
.rc-paper{max-width:820px;margin:0 auto;background:#fff;padding:34px 40px;border:1px solid var(--line);color:#111;font-size:17px;line-height:1.4}
.rc-head{display:flex;align-items:center;justify-content:space-between;gap:20px;border-bottom:2px solid var(--gold);padding-bottom:12px}.rc-head img{height:78px;-webkit-print-color-adjust:exact;print-color-adjust:exact}.rc-co{text-align:right;font-size:15px;line-height:1.45}.rc-co b{font-size:21px;font-family:"Playfair Display",Georgia,serif}
.rc-title{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin:16px 0 8px}.rc-title h1{font-size:30px;margin:0;letter-spacing:.01em}.rc-no{text-align:right}.rc-no small{display:block;font-size:13px;color:#555}.rc-no b{font-size:26px;letter-spacing:.04em}
.rc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 18px;padding:10px 0 12px;border-top:1px solid #e1ddd0;border-bottom:1px solid #e1ddd0}.rc-grid small{display:block;font-size:13px;color:#555}.rc-grid b{font-size:17px;font-weight:600}
.rc-t{width:100%;border-collapse:collapse;margin-top:12px}.rc-t td,.rc-t th{padding:6px 4px;border-bottom:1px solid #e6e2d8;text-align:left;font-size:16px}.rc-t th{font-size:13px;color:#555;text-transform:uppercase;letter-spacing:.05em}.rc-paper .r{text-align:right}.rc-sum td{font-size:18px}
.rc-sign{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-top:20px}.rc-stamp{border:3px solid;padding:6px 18px;font-weight:800;letter-spacing:.1em;font-size:18px;transform:rotate(-4deg);-webkit-print-color-adjust:exact;print-color-adjust:exact}.rc-stamp.full{color:#1d7a4d}.rc-stamp.part{color:#b3680c}
.rc-sigbox{min-width:250px;text-align:center}.rc-sig{font-family:"Segoe Script","Brush Script MT","Snell Roundhand",cursive;font-style:italic;font-size:30px;min-height:42px;line-height:1.2}.rc-line{border-top:1.5px solid #111;margin-top:2px}.rc-sigbox small{font-size:13px;color:#555}
.rc-foot{margin:16px 0 0;font-size:14px;color:#444}
.rc-paper.tight{font-size:15px;padding:26px 34px}.rc-paper.tight .rc-t td,.rc-paper.tight .rc-t th{padding:3px 4px;font-size:14px}.rc-paper.tight .rc-sum td{font-size:16px}.rc-paper.tight .rc-sign{margin-top:12px}
@media(max-width:600px){.rc-grid{grid-template-columns:1fr 1fr}.rc-paper{padding:20px 16px}.rc-title h1{font-size:24px}}
@media print{body.printing>*:not(#rcpt){display:none!important}body.printing{background:#fff}#rcpt{position:static;background:#fff;padding:0;overflow:visible}.rc-bar{display:none}.rc-paper{border:0;padding:0;max-width:none;font-size:12.5pt;break-inside:avoid;page-break-inside:avoid}.rc-paper.tight{font-size:11pt}.rc-t td,.rc-t th{font-size:12pt}.rc-paper.tight .rc-t td,.rc-paper.tight .rc-t th{font-size:10.5pt}.rc-sum td{font-size:13.5pt}.rc-title h1{font-size:23pt}.rc-no b{font-size:19pt}.rc-co{font-size:11.5pt}.rc-sig{font-size:24pt}@page{size:A4;margin:12mm}}
@media(max-width:800px){.g4,.g3{grid-template-columns:1fr 1fr}.g2{grid-template-columns:1fr}.apt{grid-template-columns:90px 1fr}.apt>div:last-child{grid-column:1/-1}.apt img{width:90px;height:66px}}
@media(max-width:520px){.g4,.g3{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app"></div><div id="toast" class="toast"></div>
<script src="admin.js"></script>
</body>
</html>
